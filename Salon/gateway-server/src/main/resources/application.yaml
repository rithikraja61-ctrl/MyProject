server:
  port: 5000

spring:
  application:
    name: gateway-server
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: USER-SERVICE
              uri: "lb://USER-SERVICE"
              predicates:
                - Path=/api/users/**,/api/auth/**,/api/admin/users/**
            - id: SALON-SERVICE
              uri: "lb://SALON-SERVICE"
              predicates:
                - Path=/salons/**,/api/salons/**,/api/admin/salons/**
            - id: SERVICE-OFFERING
              uri: "lb://SERVICE-OFFERING"
              predicates:
                - Path=/api/services/**
            - id: BOOKING-SERVICE
              uri: "lb://BOOKING-SERVICE"
              predicates:
                - Path=/api/bookings/**
            - id: PAYMENT-SERVICE
              uri: "lb://PAYMENT-SERVICE"
              predicates:
                - Path=/api/v1/payment/**
            - id: CATEGORY-SERVICE
              uri: "lb://CATEGORY-SERVICE"
              predicates:
                - Path=/api/categories/**
eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"
